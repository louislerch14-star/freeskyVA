<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentifizierung - FreeSky VA</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#000000',
                        zincBase: '#09090b',
                        vercelBlue: '#0070f3',
                    }
                }
            }
        }
    </script>
    <style>
        .bg-airplane-blur {
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.9)), url('airplane01.webp');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-darkBg text-white font-sans min-h-screen antialiased bg-airplane-blur flex flex-col justify-between">

    <header class="p-6 max-w-7xl mx-auto w-full flex justify-between items-center">
        <a href="index.html" class="flex items-center space-x-3 group">
            <img src="logo.png" alt="FreeSky Logo" class="w-6 h-6 object-contain">
            <span class="text-sm font-medium text-zinc-400 group-hover:text-white transition">← Zurück zur Startseite</span>
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-zincBase border border-zinc-800 w-full max-w-md p-8 rounded-xl shadow-2xl relative">
            
            <div class="text-center mb-6">
                <h3 id="modalTitle" class="text-2xl font-semibold tracking-tight">Anmelden</h3>
                <p id="modalSubtitle" class="text-zinc-500 text-xs mt-1">Willkommen zurück bei FreeSky VA</p>
            </div>

            <div id="roleSelector" class="grid grid-cols-2 gap-2 bg-black p-1 rounded-lg mb-6 border border-zinc-800/60 hidden">
                <button id="rolePilotBtn" onclick="setRole('pilot')" type="button" class="py-1.5 text-xs font-medium rounded-md bg-zinc-900 text-white border border-zinc-800">Pilot</button>
                <button id="roleCeoBtn" onclick="setRole('ceo')" type="button" class="py-1.5 text-xs font-medium rounded-md text-zinc-400 hover:text-white">CEO (Airline Inhaber)</button>
            </div>

            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div id="airlineNameField" class="space-y-1.5 hidden">
                    <label class="text-zinc-400 text-xs uppercase tracking-wider font-medium">Airline Name</label>
                    <input type="text" id="airlineInput" placeholder="z.B. AeroBerlin Virtual" class="w-full bg-black border border-zinc-800 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-vercelBlue transition">
                </div>

                <div class="space-y-1.5">
                    <label class="text-zinc-400 text-xs uppercase tracking-wider font-medium">E-Mail Adresse</label>
                    <input type="email" id="emailInput" required placeholder="name@beispiel.de" class="w-full bg-black border border-zinc-800 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-vercelBlue transition">
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-zinc-400 text-xs uppercase tracking-wider font-medium">Passwort</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-black border border-zinc-800 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-vercelBlue transition">
                </div>

                <button type="submit" id="modalSubmitBtn" class="w-full bg-white text-black font-medium text-sm py-2.5 rounded-md hover:bg-zinc-200 transition mt-6">
                    Anmelden
                </button>
            </form>

            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-zinc-800"></div>
                <span class="flex-shrink mx-4 text-zinc-500 text-[10px] uppercase tracking-wider">oder</span>
                <div class="flex-grow border-t border-zinc-800"></div>
            </div>

            <button onclick="loginWithGoogle()" class="w-full bg-black border border-zinc-800 text-zinc-200 font-medium text-sm py-2.5 rounded-md hover:bg-zinc-900 hover:text-white transition flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span>Mit Google fortfahren</span>
            </button>

            <div class="text-center mt-6 pt-4 border-t border-zinc-900 text-xs text-zinc-500">
                <span id="modalFooterText">Noch kein Konto?</span> 
                <button id="modalFooterLink" onclick="toggleModalMode()" class="text-vercelBlue hover:underline ml-1">Jetzt registrieren</button>
            </div>
        </div>
    </main>

    <footer class="bg-black/40 backdrop-blur-md border-t border-zinc-900 py-6 text-zinc-600 text-xs text-center">
        <p>&copy; 2026 FreeSky VA. Professional Flight Simulation Systems.</p>
    </footer>

    <script>
        // --- 1. SUPABASE INITIALISIERUNG ---
        const SUPABASE_URL = "https://edvwehmarqjdddulaszn.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_Is-1JlnB5RLLOjv3EWfw1A_akdeF51J";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let modalMode = 'login'; 
        let selectedRole = 'pilot';

        // --- 2. URL PARAMETER AUSLESEN BEIM LADEN ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode') || 'login';
            const role = urlParams.get('role') || 'pilot';

            if (mode === 'register') {
                setRegisterMode();
                setRole(role);
            } else {
                setLoginMode();
            }
        });

        function setLoginMode() {
            modalMode = 'login';
            document.getElementById('modalTitle').textContent = 'Anmelden';
            document.getElementById('modalSubtitle').textContent = 'Willkommen zurück bei FreeSky VA';
            document.getElementById('roleSelector').classList.add('hidden');
            document.getElementById('airlineNameField').classList.add('hidden');
            document.getElementById('modalSubmitBtn').textContent = 'Anmelden';
            document.getElementById('modalFooterText').textContent = 'Noch kein Konto?';
            document.getElementById('modalFooterLink').textContent = 'Jetzt registrieren';
        }

        function setRegisterMode() {
            modalMode = 'register';
            document.getElementById('modalTitle').textContent = 'Registrieren';
            document.getElementById('modalSubtitle').textContent = 'Werde Teil des virtuellen Luftfahrt-Netzwerks';
            document.getElementById('roleSelector').classList.remove('hidden');
            document.getElementById('modalSubmitBtn').textContent = 'Konto erstellen';
            document.getElementById('modalFooterText').textContent = 'Bereits registriert?';
            document.getElementById('modalFooterLink').textContent = 'Jetzt anmelden';
            updateRegisterFields();
        }

        function toggleModalMode() {
            if (modalMode === 'login') {
                setRegisterMode();
            } else {
                setLoginMode();
            }
        }

        function setRole(role) {
            selectedRole = role;
            const pilotBtn = document.getElementById('rolePilotBtn');
            const ceoBtn = document.getElementById('roleCeoBtn');
            if (role === 'pilot') {
                pilotBtn.className = "py-1.5 text-xs font-medium rounded-md bg-zinc-900 text-white border border-zinc-800";
                ceoBtn.className = "py-1.5 text-xs font-medium rounded-md text-zinc-400 hover:text-white";
            } else {
                ceoBtn.className = "py-1.5 text-xs font-medium rounded-md bg-zinc-900 text-white border border-zinc-800";
                pilotBtn.className = "py-1.5 text-xs font-medium rounded-md text-zinc-400 hover:text-white";
            }
            updateRegisterFields();
        }

        function updateRegisterFields() {
            const airlineField = document.getElementById('airlineNameField');
            if (modalMode === 'register' && selectedRole === 'ceo') {
                airlineField.classList.remove('hidden');
            } else {
                airlineField.classList.add('hidden');
            }
        }

        // --- 3. E-MAIL & PASSWORT AUTH ABSENDEN ---
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const airlineName = document.getElementById('airlineInput').value;
            const submitBtn = document.getElementById('modalSubmitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Bitte warten...';

            if (modalMode === 'login') {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    alert("Fehler: " + error.message);
                } else {
                    alert('Login erfolgreich!');
                    window.location.href = 'index.html'; // Nach Login zurück zur Hauptseite
                }
            } else {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            role: selectedRole,
                            airline_name: selectedRole === 'ceo' ? airlineName : null
                        }
                    }
                });

                if (error) {
                    alert("Fehler: " + error.message);
                } else {
                    alert('Registrierung erfolgreich! Bitte überprüfe deine E-Mails zur Bestätigung.');
                    setLoginMode();
                }
            }

            submitBtn.disabled = false;
            submitBtn.textContent = modalMode === 'login' ? 'Anmelden' : 'Konto erstellen';
        }

        // --- 4. GOOGLE OAUTH FLOW ---
        async function loginWithGoogle() {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });

            if (error) {
                alert("Google Login Fehler: " + error.message);
            }
        }
    </script>
</body>
</html>
